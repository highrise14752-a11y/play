name: Build iOS

# Native iOS app lives in ios/. Android remains a separate Gradle target.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Xcode project or workspace path relative to the repository
        required: true
        default: ios/Play.xcodeproj
        type: string
      scheme:
        description: Shared iOS app scheme
        required: true
        default: Play
        type: string
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

concurrency:
  group: play-native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    env:
      XCODE_PROJECT: ${{ inputs.project || 'ios/Play.xcodeproj' }}
      XCODE_SCHEME: ${{ inputs.scheme || 'Play' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate native iOS project
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec ios/project.yml --project ios

      - name: Build iOS tests
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
          xcodebuild -project ios/Play.xcodeproj -scheme Play \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO build-for-testing

      - name: Run simulator unit and UI tests
        run: |
          set -euo pipefail
          xcodebuild -project ios/Play.xcodeproj -scheme Play \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PlayTests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test-without-building

      - name: Upload simulator test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Play-iOS-tests-${{ github.run_number }}
          path: ${{ runner.temp }}/PlayTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate iOS project
        run: |
          set -euo pipefail
          if [[ ! -d "$XCODE_PROJECT" ]]; then
            echo "::error::Missing Xcode project: $XCODE_PROJECT. Check the project input and generation step."
            exit 1
          fi
          case "$XCODE_PROJECT" in
            *.xcworkspace|*.xcodeproj) ;;
            *) echo '::error::Choose an .xcodeproj or .xcworkspace directory.'; exit 1 ;;
          esac
          xcodebuild -version

      - name: Archive for iPhone and iPad without signing
        run: |
          set -euo pipefail
          if [[ "$XCODE_PROJECT" == *.xcworkspace ]]; then
            project_args=(-workspace "$XCODE_PROJECT")
          else
            project_args=(-project "$XCODE_PROJECT")
          fi
          xcodebuild "${project_args[@]}" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Play.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=("$RUNNER_TEMP/Play.xcarchive/Products/Applications/"*.app)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo '::error::Expected exactly one archived iOS app. Check the selected app scheme.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/ios-artifacts"
          ditto "${apps[0]}" "$RUNNER_TEMP/ipa/Payload/$(basename "${apps[0]}")"
          (cd "$RUNNER_TEMP/ipa" && zip -q -r -y "$GITHUB_WORKSPACE/ios-artifacts/Play-unsigned.ipa" Payload)
          cat > "$GITHUB_WORKSPACE/ios-artifacts/README.txt" <<'NOTE'
          Play-unsigned.ipa is an unsigned device build, not an installable signed release.
          It requires a compatible Apple signing/provisioning method before installation.
          Supported iOS versions are determined by the iOS project's deployment target.
          This workflow does not convert the Android APK into an iOS app.
          NOTE
          cat "$GITHUB_WORKSPACE/ios-artifacts/README.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Play-iOS-unsigned-${{ github.run_number }}
          path: ios-artifacts/
          if-no-files-found: error
          retention-days: 14
