name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'innertube/**'
      - 'lrclib/**'
      - 'kugou/**'
      - 'betterlyrics/**'
      - 'simpmusic/**'
      - 'canvas/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore optional stable debug signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          else
            echo '::notice::No persistent signing key configured. This build uses a temporary debug key and may not update an existing installation.'
          fi
      - name: Test and build optimized APK
        run: |
          chmod +x gradlew
          ./gradlew -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false \
            :app:testUniversalOptimizedUnitTest \
            --tests 'com.nikhil.yt.playback.haptics.*' \
            --tests 'com.nikhil.yt.playback.DownloadFileCopyTest' \
            --tests 'com.nikhil.yt.playback.StoredDownloadInitializationTest' \
            --tests 'com.nikhil.yt.lyrics.LyricsPreservationTest' \
            --tests 'com.nikhil.yt.together.TogetherCoreTest' \
            :app:exportPlayApk --console=plain --max-workers=2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Play-Android-${{ github.run_number }}
          path: app/build/outputs/play/Play.apk
          if-no-files-found: error
          retention-days: 14
